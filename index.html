<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Rick and Morty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="py-4 text-center">
        <div class="container">
            <h1 class="fw-bold">Personajes de Rick and Morty</h1>
            <p class="mb-0">Galería de personajes consumiendo una API pública</p>
        </div>
    </header>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h4 mb-0">Galería de personajes</h2>
            <span id="totalPersonajes" class="text-secondary"></span>
        </div>

        <div id="mensaje" class="alert alert-info" role="alert">Cargando personajes...</div>
        <div id="contenedorPersonajes" class="row g-4"></div>

        <nav class="d-flex justify-content-center align-items-center gap-3 mt-4" aria-label="Paginación">
            <button id="btnAnterior" class="btn btn-success" disabled>Anterior</button>
            <span id="paginaActual" class="fw-semibold">Página 1 de 42</span>
            <button id="btnSiguiente" class="btn btn-success">Siguiente</button>
        </nav>
    </main>

    <!-- Ventana modal para mostrar el detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Detalle del personaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="contenidoDetalle">
                    Cargando información...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4">
        <small>Actividad práctica DWES · Datos de The Rick and Morty API</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
